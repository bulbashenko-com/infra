# One wildcard certificate for all admin hosts, served by default for any TLS route without its own secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: int-wildcard
  namespace: kube-system
spec:
  secretName: int-wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - "*.int.bulbashenko.com"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: int-wildcard-tls
  # Matched by SNI; routes with `tls: {}` on these hosts get it. Issued in apps/staging/tls.
  certificates:
    - secretName: staging-wildcard-tls
