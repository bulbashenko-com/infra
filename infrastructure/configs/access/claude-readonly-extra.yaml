# What `view` leaves out but an observer needs: CRD definitions, k3s HelmCharts,
# Traefik routing objects, CNPG and cert-manager objects, resource metrics. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-readonly-extra
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [helm.cattle.io, traefik.io, postgresql.cnpg.io, barmancloud.cnpg.io, cert-manager.io, acme.cert-manager.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-readonly-extra
subjects:
  - kind: ServiceAccount
    name: claude-readonly
    namespace: access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-readonly-extra
