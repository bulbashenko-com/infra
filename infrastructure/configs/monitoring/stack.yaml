# victoria-metrics-k8s-stack: VMSingle (storage), vmagent (scraping), vmalert + Alertmanager (rules; notifications go
# to Telegram, see `alertmanager` below), node-exporter, kube-state-metrics and Grafana. The operator itself is a separate release in
# infrastructure/controllers. Dashboards and rules are fetched from upstream by the chart's sync Job at deploy time.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  interval: 12h
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
  ref:
    tag: 0.96.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    fullnameOverride: vm
    global:
      clusterLabel: cluster
    # Links in alerts (vmalert external.url) point at Grafana.
    external:
      grafana:
        host: https://grafana.int.bulbashenko.com

    # Installed by infrastructure/controllers/victoria-metrics-operator.yaml.
    victoria-metrics-operator:
      enabled: false

    # Upstream dashboards are detail for debugging: folder "Подробно", minus the ones for systems we do not run.
    # Ours (dashboards/, generated by scripts/dashboards) are the folder "bulbashenko", home = Здоровье.
    defaultDashboards:
      annotations:
        grafana_folder: Подробно
      dashboards:
        nodes-aix: { enabled: false }
        nodes-darwin: { enabled: false }
        k8s-resources-windows-cluster: { enabled: false }
        k8s-resources-windows-namespace: { enabled: false }
        k8s-resources-windows-pod: { enabled: false }
        k8s-windows-cluster-rsrc-use: { enabled: false }
        k8s-windows-node-rsrc-use: { enabled: false }
        k8s-resources-multicluster: { enabled: false }
        prometheus: { enabled: false }
        prometheus-remote-write: { enabled: false }
      sources:
        # Enabled by the operator subchart's switch by default; the operator runs, just not from this chart.
        victoriametrics-operator:
          enabled: true
    defaultRules:
      groups:
        # k3s runs no etcd (sqlite datastore).
        etcd:
          enabled: false
      sources:
        vmoperator:
          enabled: true

    vmsingle:
      spec:
        # Disk on every node is 40 GB; ~3 GB expected for 30 days at a 30 s scrape interval.
        retentionPeriod: 30d
        storage:
          resources:
            requests:
              storage: 10Gi
        # 768Mi got it OOMKilled (2026-11-15) under a burst of dashboard queries while a staging e2e run loaded
        # the same node; queries now come from four dashboards and the release rules.
        resources:
          requests: { cpu: 50m, memory: 384Mi }
          limits: { memory: 1Gi }

    vmagent:
      spec:
        scrapeInterval: 30s
        externalLabels:
          cluster: hel1
        resources:
          requests: { cpu: 30m, memory: 128Mi }
          limits: { memory: 384Mi }

    vmalert:
      spec:
        evaluationInterval: 30s
        resources:
          requests: { cpu: 10m, memory: 48Mi }

    # One channel for everything that needs a human: Telegram. Sources are vmalert (rules.yaml and upstream rules)
    # and Flux (flux-alerts.yaml: failed applies, health checks, staging e2e). Release summaries are sent from
    # GitHub Actions to the same chat (.github/workflows/notify.yml): Alertmanager is not reachable from there.
    # The bot token is the Secret `telegram` (telegram.sops.yaml), mounted at /etc/vm/secrets/telegram; the chat id
    # is below. Both are set once by `just telegram <token> <chat_id>`. Docs: docs/workflow.md "Уведомления".
    alertmanager:
      spec:
        externalURL: ""
        secrets: [telegram]
        resources:
          requests: { cpu: 10m, memory: 32Mi }
      # The default Slack template is useless here.
      monzoTemplate:
        enabled: false
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.icon" -}}
          {{ if eq .Status "resolved" }}✅{{ else if or (eq .Labels.severity "critical") (eq .Labels.severity "error") }}🔴{{ else if eq .Labels.severity "warning" }}🟡{{ else }}ℹ️{{ end }}
          {{- end }}
          {{ define "telegram.message" -}}
          {{ range .Alerts -}}
          {{ template "telegram.icon" . }} <b>
          {{- if .Labels.reportingcontroller }}Flux: {{ .Labels.kind }} {{ .Labels.namespace }}/{{ .Labels.name }}{{ if eq .Labels.reason "HealthCheckFailed" }} не поднялся{{ else }} не применился{{ end }}
          {{- else if .Annotations.summary }}{{ .Annotations.summary | html }}
          {{- else }}{{ .Labels.alertname }}{{ end }}</b>{{ if eq .Status "resolved" }} — снова в норме{{ end }}
          {{ if .Annotations.description }}{{ .Annotations.description | html }}{{ else if .Annotations.message }}<code>{{ .Annotations.message | reReplaceAll "(.{600}).*" "$1…" | html }}</code>{{ end }}
          {{ end -}}
          <a href="https://grafana.int.bulbashenko.com/d/health">Здоровье</a> · <a href="https://grafana.int.bulbashenko.com/d/rollout">Выкатка</a> · <a href="https://grafana.int.bulbashenko.com/d/logs">Логи</a>
          {{- end }}
      # Plain Alertmanager configuration (useManagedConfig: false), stored by the chart as the base config.
      config:
        global:
          # Flux events carry no end time: an error that is not repeated within an hour counts as resolved.
          resolve_timeout: 1h
        route:
          receiver: telegram
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            # Heartbeat and inhibition helpers from the upstream rules.
            - receiver: blackhole
              matchers: ['alertname=~"Watchdog|InfoInhibitor"']
            # Flux failures (flux-alerts.yaml): one message per object, repeated while it keeps failing.
            - receiver: telegram-events
              matchers: ['alertname=~"Flux.+"', 'reportingcontroller!=""']
              group_by: [alertname, namespace, name]
              group_wait: 10s
              repeat_interval: 6h
            # Upstream info-level rules (throttling, quota hints) are dashboard material, not messages.
            - receiver: blackhole
              matchers: ['severity="info"']
        inhibit_rules:
          - source_matchers: ['severity="critical"']
            target_matchers: ['severity=~"warning|info"']
            equal: [alertname, namespace]
        receivers:
          - name: blackhole
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/vm/secrets/telegram/token
                chat_id: -4765757619 # set by `just telegram`
                parse_mode: HTML
                send_resolved: true
                message: '{{ template "telegram.message" . }}'
          # Events have no "resolved" state worth a message.
          - name: telegram-events
            telegram_configs:
              - bot_token_file: /etc/vm/secrets/telegram/token
                chat_id: -4765757619 # set by `just telegram`
                parse_mode: HTML
                send_resolved: false
                message: '{{ template "telegram.message" . }}'

    # k3s runs the controller manager, scheduler and kube-proxy inside the k3s process, bound to localhost:
    # nothing to scrape from the pod network.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    prometheus-node-exporter:
      resources:
        requests: { cpu: 10m, memory: 24Mi }

    kube-state-metrics:
      # Ownership labels (README: Labels) as label_bulbashenko_com_* on kube_namespace_labels / kube_pod_labels,
      # for the "Cluster by layer" dashboard.
      metricLabelsAllowlist:
        - namespaces=[bulbashenko.com/layer,bulbashenko.com/app]
        - pods=[bulbashenko.com/layer,bulbashenko.com/app]
      resources:
        requests: { cpu: 10m, memory: 48Mi }

    defaultDatasources:
      victoriametrics:
        # Plain Prometheus datasource only: the VictoriaMetrics plugin would be downloaded at every pod start.
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true
      # GitHub (CI runs, open PRs) through the read-only GitHub App bulbashenko-com-grafana. Credentials come from the
      # Secret grafana via env (Grafana expands $VARS in provisioning); until they exist the datasource just errors.
      extra:
        - name: GitHub
          uid: github
          type: grafana-github-datasource
          jsonData:
            selectedAuthType: github-app
            appId: $GITHUB_APP_ID
            installationId: $GITHUB_APP_INSTALLATION_ID
          secureJsonData:
            privateKey: $GITHUB_APP_PRIVATE_KEY
        # Logs of every pod and the cluster's events (infrastructure/configs/logging).
        - name: VictoriaLogs
          uid: victorialogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://victorialogs-server.logging.svc.cluster.local:9428
          jsonData:
            maxLines: 1000

    grafana:
      fullnameOverride: grafana
      testFramework:
        enabled: false
      # No PVC: dashboards and datasources are provisioned from git, people sign in through Ory.
      persistence:
        enabled: false
      # Grafana 13 with the GitHub plugin sits around 380Mi; 384Mi got it OOMKilled.
      resources:
        requests: { cpu: 20m, memory: 256Mi }
        limits: { memory: 768Mi }
      # Local admin: used by the dashboard/datasource sidecars (basic auth against the reload API) and as break-glass
      # sign-in at /login?disableAutoLogin if Ory is down; the login form is hidden otherwise.
      # Its login must not match any Ory username: Grafana refuses to create an SSO user whose login or email is
      # taken ("User sync failed"), and it does not link accounts by login.
      admin:
        existingSecret: grafana
        userKey: admin-user
        passwordKey: admin-password
      # Bump when the Secret grafana changes: the pod restarts and, with no PVC, recreates its database.
      podAnnotations:
        bulbashenko.com/secret-revision: "3"
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef: { name: grafana, key: oidc-client-secret }
        # Optional: Grafana starts without them, only the GitHub datasource fails.
        GITHUB_APP_ID:
          secretKeyRef: { name: grafana, key: github-app-id, optional: true }
        GITHUB_APP_INSTALLATION_ID:
          secretKeyRef: { name: grafana, key: github-app-installation-id, optional: true }
        GITHUB_APP_PRIVATE_KEY:
          secretKeyRef: { name: grafana, key: github-app-private-key, optional: true }
      # Installed at every pod start (no PVC). Official, signed plugin.
      plugins:
        - grafana-github-datasource@2.9.3
        - victoriametrics-logs-datasource@0.33.1
      sidecar:
        dashboards:
          # Dashboards from this directory land in their own folder (see grafana-dashboards in kustomization.yaml).
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      grafana.ini:
        server:
          root_url: https://grafana.int.bulbashenko.com
        # "Здоровье" (dashboards/health.json) as the home page; the sidecar writes it under <folder>/<grafana_folder>/.
        dashboards:
          default_home_dashboard_path: /var/lib/grafana/dashboards/default/bulbashenko/health.json
        analytics:
          reporting_enabled: false
          check_for_updates: false
          check_for_plugin_updates: false
        news:
          news_feed_enabled: false
        users:
          allow_sign_up: false
        auth:
          disable_login_form: true
          signout_redirect_url: https://auth.bulbashenko.com/oauth2/sessions/logout
        # Ory Hydra (client `grafana` in bulbashenko-com/auth). Only infra-admins pass consent, and they get
        # Grafana server admin.
        auth.generic_oauth:
          enabled: true
          name: bulbashenko SSO
          auto_login: true
          allow_sign_up: true
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://auth.bulbashenko.com/oauth2/auth
          token_url: https://auth.bulbashenko.com/oauth2/token
          api_url: https://auth.bulbashenko.com/userinfo
          auth_style: InHeader
          use_pkce: true
          login_attribute_path: preferred_username
          email_attribute_path: email
          name_attribute_path: name
          groups_attribute_path: groups
          role_attribute_path: contains(groups[*], 'infra-admins') && 'GrafanaAdmin' || 'Viewer'
          role_attribute_strict: true
          allow_assign_grafana_admin: true
