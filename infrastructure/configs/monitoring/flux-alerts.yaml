# Flux failures to Alertmanager, and from there to Telegram (stack.yaml, route telegram-events). Only errors: a failed
# apply, a failed health check (a rollout that did not come up), a source that cannot be fetched, a Helm upgrade
# that failed. Successes are not sent here (Flux forwards them only to commit-status providers, see
# apps/staging-platform/notify.yaml); the release summary comes from GitHub Actions (release-tag.yml).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  address: http://vmalertmanager-vm.monitoring.svc.cluster.local:9093/api/v2/alerts/
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: errors
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    # Production and the cluster platform (every namespace that holds Flux objects).
    - { kind: Kustomization, name: "*" }
    - { kind: GitRepository, name: "*" }
    - { kind: HelmRelease, name: "*", namespace: flux-system }
    - { kind: HelmRelease, name: "*", namespace: kube-system }
    - { kind: HelmRelease, name: "*", namespace: cert-manager }
    - { kind: HelmRelease, name: "*", namespace: cnpg-system }
    - { kind: HelmRelease, name: "*", namespace: monitoring }
    - { kind: HelmRelease, name: "*", namespace: logging }
    - { kind: HelmRelease, name: "*", namespace: nextcloud }
    - { kind: OCIRepository, name: "*", namespace: flux-system }
    - { kind: OCIRepository, name: "*", namespace: kube-system }
    - { kind: OCIRepository, name: "*", namespace: cert-manager }
    - { kind: OCIRepository, name: "*", namespace: cnpg-system }
    - { kind: OCIRepository, name: "*", namespace: monitoring }
    - { kind: OCIRepository, name: "*", namespace: logging }
    - { kind: OCIRepository, name: "*", namespace: nextcloud }
    - { kind: HelmRepository, name: "*", namespace: nextcloud }
    # Staging: the stack and the e2e runs (a red e2e blocks the release PR; this says why).
    - { kind: Kustomization, name: "*", namespace: auth-staging }
    - { kind: Kustomization, name: "*", namespace: site-staging }
