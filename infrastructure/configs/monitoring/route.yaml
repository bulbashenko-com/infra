# Grafana on the mesh only; it does its own OIDC sign-in (client grafana in the auth repo).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.int.bulbashenko.com`)
      middlewares:
        - { name: mesh-only, namespace: kube-system }
      services:
        - { name: grafana, port: 80 }
  tls: {}
