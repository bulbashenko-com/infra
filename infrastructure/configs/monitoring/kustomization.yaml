apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Ownership labels (see README: Labels). Selectors are left alone.
labels:
  - pairs:
      bulbashenko.com/layer: platform
      bulbashenko.com/app: monitoring
    includeSelectors: false
resources:
  - secret.sops.yaml
  - stack.yaml
  - scrapes.yaml
  - route.yaml
# Our own dashboards; the Grafana sidecar picks up ConfigMaps labelled grafana_dashboard=1 in this namespace.
configMapGenerator:
  - name: grafana-dashboards-bulbashenko
    namespace: monitoring
    files:
      - dashboards/cluster-by-layer.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: bulbashenko
