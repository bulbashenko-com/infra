apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Ownership labels (see README: Labels). Selectors are left alone.
labels:
  - pairs:
      bulbashenko.com/layer: platform
      bulbashenko.com/app: monitoring
    includeSelectors: false
resources:
  - secret.sops.yaml
  - stack.yaml
  - scrapes.yaml
  - route.yaml
  - rules.yaml
  - telegram.sops.yaml
  - flux-alerts.yaml
# Our own dashboards, generated by `python3 -m scripts.dashboards infrastructure/configs/monitoring/dashboards`
# (never edit the JSON; CI checks it matches). The Grafana sidecar picks up ConfigMaps labelled grafana_dashboard=1.
configMapGenerator:
  - name: grafana-dashboards-bulbashenko
    namespace: monitoring
    files:
      - dashboards/health.json
      - dashboards/releases.json
      - dashboards/rollout.json
      - dashboards/logs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: bulbashenko
