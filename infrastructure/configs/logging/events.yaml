# Kubernetes events (pulls, crash loops, failed mounts, Flux's own events) live only an hour in the API. This
# exporter prints each one as a JSON line to stdout, so the collector ships them to VictoriaLogs like any log:
# the «Логи» dashboard shows them as "События Kubernetes". resmoio/kubernetes-event-exporter is in maintenance mode
# (last release 2024) but the events API it reads is stable; replace it if it stops working.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-exporter
  namespace: logging
---
# Read-only: events, plus the objects they refer to (for their labels). `view` cannot read Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: event-exporter
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view }
subjects:
  - { kind: ServiceAccount, name: event-exporter, namespace: logging }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-exporter
  namespace: logging
data:
  config.yaml: |
    logLevel: error
    logFormat: json
    maxEventAgeSeconds: 60
    route:
      routes:
        - match:
            - receiver: stdout
    receivers:
      - name: stdout
        stdout:
          deDot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-exporter
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels: { app: event-exporter }
  template:
    metadata:
      labels: { app: event-exporter }
      annotations:
        bulbashenko.com/config-revision: "1"
    spec:
      serviceAccountName: event-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: event-exporter
          image: ghcr.io/resmoio/kubernetes-event-exporter:v1.7
          args: [-conf=/data/config.yaml]
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: event-exporter }
