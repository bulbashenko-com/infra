# Labels for namespaces that Kubernetes or k3s create themselves (flux-system is labelled by the
# FluxInstance, which owns it). Flux only adds the labels;
# prune is disabled so removing this file can never delete them.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels: { bulbashenko.com/layer: system, bulbashenko.com/app: kubernetes }
  annotations: { kustomize.toolkit.fluxcd.io/prune: disabled }
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels: { bulbashenko.com/layer: system, bulbashenko.com/app: kubernetes }
  annotations: { kustomize.toolkit.fluxcd.io/prune: disabled }
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  labels: { bulbashenko.com/layer: system, bulbashenko.com/app: kubernetes }
  annotations: { kustomize.toolkit.fluxcd.io/prune: disabled }
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  labels: { bulbashenko.com/layer: system, bulbashenko.com/app: kubernetes }
  annotations: { kustomize.toolkit.fluxcd.io/prune: disabled }
