# trust-manager: copies the public part of our internal CA (infrastructure/configs/cert-manager/internal-ca.yaml)
# into a ConfigMap in every namespace, so clients can verify in-cluster TLS (Postgres first) without ever seeing
# the CA key. Lives next to cert-manager; its trust namespace (where Bundle sources are read) is cert-manager.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 12h
  url: oci://quay.io/jetstack/charts/trust-manager
  ref:
    tag: v0.25.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 1h
  # The chart's webhook certificate is a cert-manager Certificate.
  dependsOn:
    - name: cert-manager
  chartRef:
    kind: OCIRepository
    name: trust-manager
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    resources:
      requests: { cpu: 10m, memory: 48Mi }
