# The CI cluster (.github/workflows/cluster-e2e.yml): the production tree (clusters/hel1) on a throw-away k3d cluster,
# same domain, same manifests. Everything that differs is a patch in this file, so the difference stays reviewable:
#
# - no Flux Operator: the workflow installs Flux with the CLI and points the GitRepository at the pull request;
# - no staging (it goes away in release 2);
# - no SOPS: Secrets are generated by scripts/ci-secrets.py before Flux starts (the age key never reaches CI), so the
#   encrypted Secrets are dropped from every Kustomization that decrypts;
# - nothing that talks to the outside world: Let's Encrypt becomes the internal CA, *.bulbashenko.com resolves to the
#   cluster's own Traefik, cloudflared is gone, Nextcloud's Storage Box mount is a local volume, CronJobs are
#   suspended;
# - workloads that refuse to start on an empty volume (restore-once) start empty, and the clients of
#   https://auth.bulbashenko.com trust the internal CA;
# - Cloudflare's part is played by Traefik itself (cloudflare.yaml): public names are served on websecure with an
#   internal-CA certificate and handed to the `web` entrypoint, where production's routes live;
# - every Kustomization times out after 5 minutes, so a broken workload fails the run quickly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../hel1
  - cloudflare.yaml
patches:
  # Flux Operator, Flux itself and staging.
  - patch: |
      $patch: delete
      apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      metadata: { name: flux, namespace: flux-system }
  - patch: |
      $patch: delete
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: { name: flux-operator, namespace: flux-system }
  - patch: |
      $patch: delete
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata: { name: flux-operator, namespace: flux-system }
  - patch: |
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: staging-platform, namespace: flux-system }
  - patch: |
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: staging, namespace: flux-system }
  - patch: |
      $patch: delete
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata: { name: infra-dev, namespace: flux-system }

  # Fail fast: 5 minutes per Kustomization (a cold start of the whole tree takes about 6).
  - target: { group: kustomize.toolkit.fluxcd.io, kind: Kustomization }
    patch: |
      - op: add
        path: /spec/timeout
        value: 5m

  # Workloads that call https://*.bulbashenko.com at start (Headscale's OIDC discovery) wait for the stand-in.
  - target: { group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: ^edge$ }
    patch: |
      - op: add
        path: /spec/dependsOn/-
        value: { name: ci-cloudflare }

  # Every Kustomization that decrypts SOPS: no decryption, its Secrets dropped (scripts/ci-secrets.py made them),
  # CronJobs suspended. Listed by name: a new decrypting Kustomization fails CI until it is added here.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: ^(infrastructure|apps|edge|mail-base|nextcloud|site)$
    patch: |
      - op: remove
        path: /spec/decryption
      - op: add
        path: /spec/patches
        value:
          - target: { kind: Secret }
            patch: |
              $patch: delete
              apiVersion: v1
              kind: Secret
              metadata: { name: any }
          - target: { kind: CronJob }
            patch: |
              apiVersion: batch/v1
              kind: CronJob
              metadata: { name: any }
              spec: { suspend: true }

  # infrastructure: internal CA instead of Let's Encrypt, the domain resolves inside the cluster, no tunnel.
  - target: { group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: ^infrastructure$ }
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target: { kind: ClusterIssuer, name: letsencrypt }
          patch: |
            - op: remove
              path: /spec/acme
            - op: add
              path: /spec/ca
              value: { secretName: internal-ca }
      - op: add
        path: /spec/patches/-
        value:
          target: { kind: ConfigMap, name: coredns-custom, namespace: kube-system }
          patch: |
            - op: add
              path: /data/ci.override
              value: |
                rewrite stop name regex ^(.+\.)?bulbashenko\.com\.$ traefik.kube-system.svc.cluster.local. answer auto
      - op: add
        path: /spec/patches/-
        value:
          target: { kind: Deployment, name: cloudflared }
          patch: |
            $patch: delete
            apiVersion: apps/v1
            kind: Deployment
            metadata: { name: any }

  # edge: Headscale starts on an empty volume and trusts the internal CA (it reads OIDC discovery at start).
  - target: { group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: ^edge$ }
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target: { kind: Deployment, name: headscale }
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata: { name: headscale }
            spec:
              template:
                spec:
                  initContainers:
                    - { name: restore, $patch: delete }
                  containers:
                    - name: headscale
                      env:
                        - { name: SSL_CERT_FILE, value: /etc/ci-ca/ca-certificates.crt }
                      volumeMounts:
                        - { name: ci-ca, mountPath: /etc/ci-ca, readOnly: true }
                  volumes:
                    - { name: ci-ca, configMap: { name: ca-bundle } }

  # Nextcloud: a local volume instead of the Storage Box share.
  - target: { group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: ^nextcloud$ }
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target: { kind: PersistentVolume, name: nextcloud-data }
          patch: |
            $patch: delete
            apiVersion: v1
            kind: PersistentVolume
            metadata: { name: any }
      - op: add
        path: /spec/patches/-
        value:
          target: { kind: PersistentVolumeClaim, name: nextcloud-data }
          patch: |
            - op: replace
              path: /spec
              value:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources: { requests: { storage: 2Gi } }

  # site: trusts the internal CA (its sign-in talks to https://auth.bulbashenko.com).
  - target: { group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: ^site$ }
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target: { kind: Deployment, name: site }
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata: { name: site }
            spec:
              template:
                spec:
                  containers:
                    - name: site
                      env:
                        - { name: NODE_EXTRA_CA_CERTS, value: /etc/internal-ca/ca.crt }
