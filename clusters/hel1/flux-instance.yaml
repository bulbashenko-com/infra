# Flux itself, reconciled by Flux Operator. Applied once by `just bootstrap-flux`, then managed from here.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  labels:
    bulbashenko.com/layer: platform
    bulbashenko.com/app: gitops
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  # Ownership labels on everything the operator creates for Flux (README: Labels).
  commonMetadata:
    labels:
      bulbashenko.com/layer: platform
      bulbashenko.com/app: gitops
  distribution:
    version: "2.9.x"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: small
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  sync:
    kind: GitRepository
    url: https://github.com/bulbashenko-com/infra.git
    # Production follows the release branch; main is staging (README: Releases).
    ref: refs/heads/production
    path: clusters/hel1
    interval: 1m
