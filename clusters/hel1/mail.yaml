# Mail: apps/mail (namespace, Secret) -> Stalwart from bulbashenko-com/mail (pinned commit, changed by scripts/promote.sh).
# Data lives in the CNPG database stalwart (imported from Coolify on 2026-10-12).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mail-base
  namespace: flux-system
  labels: { bulbashenko.com/layer: app, bulbashenko.com/app: mail }
spec:
  dependsOn:
    - name: apps
  interval: 10m
  path: ./apps/mail
  prune: true
  wait: true
  sourceRef: { kind: GitRepository, name: flux-system }
  decryption: { provider: sops, secretRef: { name: sops-age } }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mail
  namespace: flux-system
  labels: { bulbashenko.com/layer: app, bulbashenko.com/app: mail }
spec:
  interval: 10m
  url: https://github.com/bulbashenko-com/mail.git
  ref:
    commit: 3268cf46499651559674d6ca4bf4d7dc527f0cae
  ignore: |
    /*
    !/kustomization.yaml
    !/deploy/k8s/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mail
  namespace: flux-system
  labels: { bulbashenko.com/layer: app, bulbashenko.com/app: mail }
spec:
  dependsOn:
    - name: mail-base
  interval: 10m
  sourceRef: { kind: GitRepository, name: mail }
  path: ./
  targetNamespace: mail
  prune: true
  wait: true
  timeout: 10m
  commonMetadata:
    labels: { bulbashenko.com/layer: app, bulbashenko.com/app: mail }
