# bulbashenko.com. Own Flux Kustomization so a bad site release cannot block data/auth.
# Promote = newTag in apps/production/site/kustomization.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: site
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 10m
  path: ./apps/production/site
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
