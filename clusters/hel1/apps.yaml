# Production workloads. Waits for the platform; SOPS Secrets decrypted with flux-system/sops-age.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: data
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./apps/production
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
