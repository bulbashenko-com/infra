# One-shot data migration from Coolify. Own Kustomization so a failing Job cannot block apps/auth/site.
# Removed after cutover together with apps/production/migration and bootstrap/migration.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: migration
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 10m
  path: ./apps/production/migration
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
