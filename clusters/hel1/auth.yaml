# Ory stack from bulbashenko-com/auth, pinned to one commit. Its own Flux Kustomization at cluster level,
# so a broken auth release cannot block `apps` (data, site) and vice versa. Pinned: configs (Kustomize base at the repo root)
# and the auth-ui image built from that same commit. Promote = change both SHAs below.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: auth
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/bulbashenko-com/auth.git
  ref:
    commit: 7ccff4f5443352712960573450e16ce8c533c0e7
  ignore: |
    /*
    !/kustomization.yaml
    !/deploy/k8s/
    !/ory/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: auth
  path: ./
  targetNamespace: auth
  # Namespace and the Secret `auth` come from `apps` (apps/production/auth).
  dependsOn:
    - name: apps
  prune: true
  wait: true
  timeout: 10m
  images:
    - name: ghcr.io/bulbashenko-com/auth-ui
      newTag: 7ccff4f5443352712960573450e16ce8c533c0e7
