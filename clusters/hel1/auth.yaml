# Ory stack from bulbashenko-com/auth, pinned to one commit. Its own Flux Kustomization at cluster level,
# so a broken auth release cannot block `apps` (data, site) and vice versa. Pinned: configs (Kustomize base at the repo root)
# and the auth-ui image built from that same commit. Both SHAs are changed by deploy PRs (scripts/promote.sh).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: auth
  namespace: flux-system
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: auth
spec:
  interval: 10m
  url: https://github.com/bulbashenko-com/auth.git
  ref:
    commit: 80aa848072eb36d9402568885b821c9dcf7e3b66
  ignore: |
    /*
    !/kustomization.yaml
    !/deploy/k8s/
    !/ory/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: auth
  path: ./
  targetNamespace: auth
  # Ownership labels on every object from the auth repo (pod templates excluded).
  commonMetadata:
    labels:
      bulbashenko.com/layer: app
      bulbashenko.com/app: auth
  # Namespace and the Secret `auth` come from `apps` (apps/production/auth).
  dependsOn:
    - name: apps
  prune: true
  wait: true
  timeout: 10m
  images:
    - name: ghcr.io/bulbashenko-com/auth-ui
      newTag: 80aa848072eb36d9402568885b821c9dcf7e3b66
