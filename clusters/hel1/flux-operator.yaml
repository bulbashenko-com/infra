# Flux Operator upgrades itself from git. The release name matches the one
# `just bootstrap-flux` installed with Helm, so helm-controller adopts it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
  labels:
    bulbashenko.com/layer: platform
    bulbashenko.com/app: gitops
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  ref:
    tag: 0.61.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
  labels:
    bulbashenko.com/layer: platform
    bulbashenko.com/app: gitops
spec:
  interval: 1h
  releaseName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-operator
  values:
    web:
      # Sign-in and settings for the web UI (flux.int.bulbashenko.com), from infrastructure/configs/flux-web.
      configSecretName: flux-web-config
