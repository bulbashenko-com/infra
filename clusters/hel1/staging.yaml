# Staging (apps/staging) is read from the dev branch; everything else in this cluster comes from main:
# a merge to dev reaches staging at once, production only with the release PR dev -> main (README: Releases).
# Databases and the bucket are created by `apps` (apps/production/data).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra-dev
  namespace: flux-system
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: staging
spec:
  interval: 1m
  url: https://github.com/bulbashenko-com/infra.git
  ref:
    branch: dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging
  namespace: flux-system
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: staging
spec:
  dependsOn:
    - name: apps
  interval: 10m
  path: ./apps/staging
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: infra-dev
  decryption:
    provider: sops
    secretRef:
      name: sops-age
