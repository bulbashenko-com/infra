# Staging (apps/staging) is read from the dev branch; everything else in this cluster comes from main:
# a merge to dev reaches staging at once, production only with the release PR dev -> main (README: Releases).
# Databases and the buckets are created by `apps` (apps/production/data); namespaces, RBAC, the certificate and
# the content export by `staging-platform` (apps/staging-platform, from main).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-platform
  namespace: flux-system
  labels:
    bulbashenko.com/layer: platform
    bulbashenko.com/app: staging
spec:
  dependsOn:
    - name: apps
  interval: 10m
  path: ./apps/staging-platform
  prune: true
  # Applied, not awaited: the export Jobs may retry until Garage has imported their key, and `staging` should not
  # wait for that. The certificate is what staging needs; it is checked.
  healthChecks:
    - { apiVersion: cert-manager.io/v1, kind: Certificate, name: staging-wildcard, namespace: kube-system }
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # github-app.sops.yaml (the deploy App's key for notify.yaml).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra-dev
  namespace: flux-system
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: staging
spec:
  interval: 1m
  url: https://github.com/bulbashenko-com/infra.git
  ref:
    branch: dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging
  namespace: flux-system
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: staging
spec:
  dependsOn:
    - name: staging-platform
  interval: 10m
  path: ./apps/staging
  # dev lands without the owner's review: confined to the staging namespaces (apps/staging-platform/rbac.yaml).
  serviceAccountName: staging-reconciler
  prune: true
  # Not `wait`: that would also wait for the nested Kustomization auth-staging/auth and its e2e run. The site is
  # checked here; Ory's health is its own Kustomization's (and the release gate's) business.
  healthChecks:
    - { apiVersion: apps/v1, kind: Deployment, name: site, namespace: site-staging }
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: infra-dev
  decryption:
    provider: sops
    secretRef:
      name: sops-age
