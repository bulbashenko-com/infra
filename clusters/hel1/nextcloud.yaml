# cloud.bulbashenko.com. Own Flux Kustomization so a bad Nextcloud release cannot block data/auth.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
  namespace: flux-system
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: nextcloud
spec:
  dependsOn:
    - name: apps
  interval: 10m
  path: ./apps/production/nextcloud
  prune: true
  wait: true
  timeout: 25m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
