# bulbashenko.com (Next.js standalone), shared by production (apps/production/site) and staging (apps/staging/site).
# What differs per environment comes from the overlay: the Secret `site`, the ConfigMap `site-env` (URLs, bucket),
# the route, and the secret-revision annotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 1
  selector:
    matchLabels: { app: site }
  template:
    metadata:
      labels: { app: site }
    spec:
      securityContext:
        runAsNonRoot: true
        # The image user is `node` (uid 1000); the kubelet needs the numeric id.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: site
          image: ghcr.io/bulbashenko-com/site:latest
          envFrom:
            - secretRef: { name: site }
            - configMapRef: { name: site-env }
          env:
            - { name: S3_ENDPOINT, value: "http://garage.data.svc.cluster.local:3900" }
            - { name: OIDC_CLIENT_ID, value: bulbashenko-site }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            tcpSocket: { port: http }
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
            # CA of the Postgres server certificate; DATABASE_URL uses it as sslrootcert (verify-full).
            - { name: internal-ca, mountPath: /etc/internal-ca, readOnly: true }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        # trust-manager puts ConfigMap internal-ca into every namespace (infrastructure/configs/cert-manager).
        - name: internal-ca
          configMap: { name: internal-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: site
spec:
  selector: { app: site }
  ports:
    - { name: http, port: 3000, targetPort: http }
