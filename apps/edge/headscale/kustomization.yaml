apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headscale
labels:
  - pairs:
      bulbashenko.com/layer: platform
      bulbashenko.com/app: headscale
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - secret.sops.yaml
  - backup.yaml
  - headscale.yaml
configMapGenerator:
  - name: volume-backup
    files:
      - volume-backup.sh
  - name: headscale-config
    files:
      - config.yaml
      - policy.hujson
  - name: restore-once
    files:
      - restore-once.sh
