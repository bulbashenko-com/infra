server_url: https://hs.bulbashenko.com
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
# Traefik pods (k3s pod network 10.42.0.0/16) forward the real client address.
trusted_proxies:
  - 10.42.0.0/16

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "hel1"
    region_name: "hel1-edge (bulbashenko.com)"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 62.238.18.202
    ipv6: 2a01:4f9:c012:b6f5::1
  # Tailscale's public relays stay as a fallback.
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: true

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# TLS is terminated by Traefik.
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  # Device names are <host>.int.bulbashenko.com; internal admin hostnames live under the same domain as
  # extra records, so clients resolve them through split DNS without taking over all of their DNS.
  base_domain: int.bulbashenko.com
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  # Admin UIs, resolved over the mesh (split DNS) to hel1-cp (100.64.0.5): Traefik with mesh-only + Ory.
  # IPv4 only.
  extra_records:
    - {name: "users.int.bulbashenko.com", type: "A", value: "100.64.0.5"}
    - {name: "flux.int.bulbashenko.com", type: "A", value: "100.64.0.5"}
    - {name: "grafana.int.bulbashenko.com", type: "A", value: "100.64.0.5"}
    - {name: "mail.int.bulbashenko.com", type: "A", value: "100.64.0.5"}

oidc:
  only_start_if_oidc_is_available: true
  issuer: "https://auth.bulbashenko.com"
  client_id: "headscale"
  scope: ["openid", "profile", "email", "groups"]
  email_verified_required: false
  allowed_groups:
    - vpn-users
  pkce:
    enabled: true
    method: S256

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
taildrop:
  enabled: true
