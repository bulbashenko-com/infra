# Namespace and Secret only; the workload comes from bulbashenko-com/teamspeak (clusters/hel1/teamspeak.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: teamspeak
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: teamspeak
    includeSelectors: false
resources:
  - namespace.yaml
  - secret.sops.yaml
  - backup.yaml
configMapGenerator:
  - name: volume-backup
    files:
      - volume-backup.sh
