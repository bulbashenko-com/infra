apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: teamspeak
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: teamspeak
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - secret.sops.yaml
  - teamspeak.yaml
configMapGenerator:
  - name: restore-once
    files:
      - restore-once.sh
