# TeamSpeak 6 on hel1-edge: ts.bulbashenko.com (DNS-only) -> edge IP; voice 9987/udp, files 30033/tcp as
# host ports. Web Query stays inside the pod network (guest off, admin key from the Secret).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teamspeak-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamspeak
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: teamspeak }
  template:
    metadata:
      labels: { app: teamspeak }
    spec:
      nodeSelector:
        node.bulbashenko.com/role: edge
      securityContext:
        runAsNonRoot: true
        runAsUser: 9987
        runAsGroup: 9987
        fsGroup: 9987
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: restore
          image: rclone/rclone:1.71.2
          command: ["/bin/sh", "/scripts/restore-once.sh"]
          env:
            - { name: ARCHIVE, value: teamspeak.tar.gz }
            - { name: HOME, value: /tmp }
          envFrom:
            - secretRef: { name: teamspeak }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /scripts }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: teamspeak
          image: teamspeaksystems/teamspeak6-server:6.0.0-beta13.1
          env:
            - { name: TSSERVER_LICENSE_ACCEPTED, value: accept }
            - { name: TSSERVER_DEFAULT_PORT, value: "9987" }
            - { name: TSSERVER_VOICE_IP, value: "0.0.0.0" }
            - { name: TSSERVER_FILE_TRANSFER_PORT, value: "30033" }
            - { name: TSSERVER_FILE_TRANSFER_IP, value: "0.0.0.0" }
            - { name: TSSERVER_QUERY_HTTP_ENABLED, value: "true" }
            - { name: TSSERVER_QUERY_HTTP_ALLOW_GUEST, value: "0" }
            - { name: TSSERVER_QUERY_SSH_ENABLED, value: "false" }
            - name: TSSERVER_QUERY_ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: teamspeak, key: TSSERVER_QUERY_ADMIN_API_KEY } }
          ports:
            - { name: voice, containerPort: 9987, hostPort: 9987, protocol: UDP }
            - { name: files, containerPort: 30033, hostPort: 30033, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: files }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/tsserver }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: teamspeak-data }
        - name: scripts
          configMap: { name: restore-once }
        - { name: tmp, emptyDir: {} }
