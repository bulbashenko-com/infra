# Window step: fetch the export taken from the stopped Coolify container, then `stalwart --import` it into
# the empty Postgres database. The mail Kustomization starts the server only after this Job succeeded.
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-import
  annotations:
    # Recreate the (immutable) Job when its spec changes.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch
          image: rclone/rclone:1.71.2
          command: ["/bin/sh", "/scripts/import.sh"]
          env:
            - { name: HOME, value: /tmp }
          envFrom:
            - secretRef: { name: stalwart }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: export, mountPath: /export }
            - { name: scripts, mountPath: /scripts }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: import
          image: stalwartlabs/stalwart:v0.16.23
          args: ["--config", "/etc/stalwart/config.json", "--import", "/export"]
          envFrom:
            - secretRef: { name: stalwart }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }
          securityContext:
            # cap_net_bind_service is a file capability of the binary; exec fails unless it can be granted.
            allowPrivilegeEscalation: true
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          volumeMounts:
            - { name: config, mountPath: /etc/stalwart }
            - { name: export, mountPath: /export }
            - { name: scratch, mountPath: /var/lib/stalwart }
      volumes:
        - name: config
          configMap: { name: stalwart-import-config }
        - name: scripts
          configMap: { name: stalwart-import-scripts }
        - { name: export, emptyDir: {} }
        - { name: scratch, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
