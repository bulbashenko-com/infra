# One-time migration from Coolify (2026-10). Removed after the mail server runs in the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mail
resources:
  - job.yaml
configMapGenerator:
  - name: stalwart-import-config
    files:
      - config.json
  - name: stalwart-import-scripts
    files:
      - import.sh
