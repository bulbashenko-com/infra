# Ory from bulbashenko-com/auth in staging: the repo's root base plus its staging component (deploy/staging), at
# the same commit and image as production (clusters/hel1/auth.yaml), then the e2e run against it (auth-e2e).
# scripts/promote.sh changes all pins in one commit on dev: staging runs it at once, production with the release.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: auth
spec:
  interval: 10m
  url: https://github.com/bulbashenko-com/auth.git
  ref:
    commit: c7ee1b8ddc6edfefd667130e4877e01d7668d82a
  ignore: |
    /*
    !/kustomization.yaml
    !/deploy/k8s/
    !/deploy/staging/
    !/ory/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: auth
  path: ./
  components:
    - deploy/staging
  targetNamespace: auth-staging
  # As the dev-side Kustomization that created it: rights in this namespace only (rbac.yaml).
  serviceAccountName: staging-reconciler
  commonMetadata:
    labels:
      bulbashenko.com/layer: app
      bulbashenko.com/app: auth
      bulbashenko.com/env: staging
  prune: true
  wait: true
  timeout: 10m
  images:
    - name: ghcr.io/bulbashenko-com/auth-ui
      newTag: c7ee1b8ddc6edfefd667130e4877e01d7668d82a
---
# The e2e suite against the stack above, after it: Flux starts it only once `auth` is ready, and the Job itself waits
# for the auth commit its image was built from. Its manifests live here (./e2e) and are read from dev (infra-dev), so
# each result names the dev commit: Flux posts it as the commit status staging/auth-e2e on that commit, which merging
# the release PR into main requires (apps/staging-platform/notify.yaml). Its own Kustomization, so the stack's health
# never waits for tests.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth-e2e
spec:
  interval: 10m
  dependsOn:
    - name: auth
  sourceRef:
    kind: GitRepository
    name: infra-dev
    namespace: flux-system
  path: ./apps/staging/auth/e2e
  targetNamespace: auth-staging
  serviceAccountName: staging-reconciler
  commonMetadata:
    labels:
      bulbashenko.com/layer: app
      bulbashenko.com/app: auth
      bulbashenko.com/env: staging
  prune: true
  # The run takes about 12 minutes.
  wait: true
  timeout: 30m
  images:
    - name: ghcr.io/bulbashenko-com/auth-e2e
      newTag: c7ee1b8ddc6edfefd667130e4877e01d7668d82a
