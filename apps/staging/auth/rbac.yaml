# The nested Kustomization `auth` (flux.yaml) impersonates this ServiceAccount: everything in auth-staging, nothing
# elsewhere, the same confinement as the `staging` Kustomization.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-reconciler-local
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: staging-reconciler, namespace: auth-staging }
