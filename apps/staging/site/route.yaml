# Staging site on bulbashenko.dev: mesh only, TLS from staging-wildcard (Traefik's default TLSStore).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`bulbashenko.dev`)
      middlewares:
        - { name: mesh-only, namespace: kube-system }
      services: [{ name: site, port: 3000 }]
  tls: {}
