# Production side of the staging refresh (README in apps/staging): nightly dump of the site's content database
# into the bucket staging-seed. Staging restores from there (apps/staging/site/refresh.yaml) and never gets
# credentials for production's database.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: staging-seed-export
  namespace: data
  labels: { bulbashenko.com/layer: platform, bulbashenko.com/app: staging }
spec:
  schedule: "30 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels: { bulbashenko.com/layer: app, bulbashenko.com/app: staging }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie
              command: ["/bin/sh", "/scripts/seed-export.sh", "dump"]
              env:
                - { name: PGHOST, value: pg-rw.data.svc.cluster.local }
                - { name: PGDATABASE, value: bulbashenko }
                - { name: PGUSER, valueFrom: { secretKeyRef: { name: pg-role-bulbashenko, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: pg-role-bulbashenko, key: password } } }
                - { name: PGSSLMODE, value: verify-full }
                - { name: PGSSLROOTCERT, value: /etc/internal-ca/ca.crt }
              volumeMounts: &mounts
                - { name: scripts, mountPath: /scripts }
                - { name: work, mountPath: /work }
                - { name: internal-ca, mountPath: /etc/internal-ca, readOnly: true }
              resources:
                requests: { cpu: 10m, memory: 64Mi }
              securityContext: &hardened
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          containers:
            - name: upload
              image: rclone/rclone:1.71.2
              command: ["/bin/sh", "/scripts/seed-export.sh", "upload"]
              env:
                - { name: HOME, value: /work }
                - { name: RCLONE_CONFIG_GARAGE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_GARAGE_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_GARAGE_ENDPOINT, value: "http://garage.data.svc.cluster.local:3900" }
                - { name: RCLONE_CONFIG_GARAGE_REGION, value: garage }
                - { name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE, value: "true" }
                - { name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: garage, key: KEY_STAGING_EXPORT_ID } } }
                - { name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: garage, key: KEY_STAGING_EXPORT_SECRET } } }
              volumeMounts: *mounts
              resources:
                requests: { cpu: 10m, memory: 32Mi }
              securityContext: *hardened
          volumes:
            - name: scripts
              configMap: { name: staging-seed-export }
            - { name: work, emptyDir: {} }
            - name: internal-ca
              configMap: { name: internal-ca }
---
# The same export once, right when this lands (and again whenever the script changes), so staging does not wait
# for the night. Flux recreates it thanks to `force` when its spec changes (the script ConfigMap's hash).
apiVersion: batch/v1
kind: Job
metadata:
  name: staging-seed-export
  namespace: data
  labels: { bulbashenko.com/layer: platform, bulbashenko.com/app: staging }
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { bulbashenko.com/layer: app, bulbashenko.com/app: staging }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: dump
          image: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie
          command: ["/bin/sh", "/scripts/seed-export.sh", "dump"]
          env:
            - { name: PGHOST, value: pg-rw.data.svc.cluster.local }
            - { name: PGDATABASE, value: bulbashenko }
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: pg-role-bulbashenko, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: pg-role-bulbashenko, key: password } } }
            - { name: PGSSLMODE, value: verify-full }
            - { name: PGSSLROOTCERT, value: /etc/internal-ca/ca.crt }
          volumeMounts: &mounts
            - { name: scripts, mountPath: /scripts }
            - { name: work, mountPath: /work }
            - { name: internal-ca, mountPath: /etc/internal-ca, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: upload
          image: rclone/rclone:1.71.2
          command: ["/bin/sh", "/scripts/seed-export.sh", "upload"]
          env:
            - { name: HOME, value: /work }
            - { name: RCLONE_CONFIG_GARAGE_TYPE, value: s3 }
            - { name: RCLONE_CONFIG_GARAGE_PROVIDER, value: Other }
            - { name: RCLONE_CONFIG_GARAGE_ENDPOINT, value: "http://garage.data.svc.cluster.local:3900" }
            - { name: RCLONE_CONFIG_GARAGE_REGION, value: garage }
            - { name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE, value: "true" }
            - { name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: garage, key: KEY_STAGING_EXPORT_ID } } }
            - { name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: garage, key: KEY_STAGING_EXPORT_SECRET } } }
          volumeMounts: *mounts
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          securityContext: *hardened
      volumes:
        - name: scripts
          configMap: { name: staging-seed-export }
        - { name: work, emptyDir: {} }
        - name: internal-ca
          configMap: { name: internal-ca }
