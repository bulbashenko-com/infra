# Production side of staging (Flux Kustomization `staging-platform`, from main): what the dev-side `staging`
# Kustomization may not or should not own. Namespaces and the RBAC that confines it, the TLS certificate, and the
# nightly export of production content for the staging refresh. Design: infra#121.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Ownership labels are set in each file: the namespaces are `app`, the rest is `platform` (README: Labels).
resources:
  - namespaces.yaml
  - rbac.yaml
  - certificate.yaml
  - seed-export.yaml
  - github-app.sops.yaml
  - notify.yaml
configMapGenerator:
  - name: staging-seed-export
    namespace: data
    files:
      - seed-export.sh
    options:
      labels: { bulbashenko.com/layer: platform, bulbashenko.com/app: staging }
