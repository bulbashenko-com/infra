# Staging namespaces. Owned here (production side, from main) so that the `staging` Kustomization, which reads
# the dev branch, can run with rights limited to them (rbac.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: site-staging
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: site
    bulbashenko.com/env: staging
---
apiVersion: v1
kind: Namespace
metadata:
  name: auth-staging
  labels:
    bulbashenko.com/layer: app
    bulbashenko.com/app: auth
    bulbashenko.com/env: staging
