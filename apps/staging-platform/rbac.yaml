# The `staging` Kustomization (clusters/hel1/staging.yaml) reads the dev branch, where changes land without the
# owner's review, so it runs as this ServiceAccount: full rights inside the staging namespaces, nothing elsewhere.
# A dev change that names another namespace fails instead of touching production.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-reconciler
  namespace: flux-system
  labels: { bulbashenko.com/layer: platform, bulbashenko.com/app: staging }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-reconciler
  namespace: site-staging
  labels: { bulbashenko.com/layer: platform, bulbashenko.com/app: staging }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: staging-reconciler, namespace: flux-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-reconciler
  namespace: auth-staging
  labels: { bulbashenko.com/layer: platform, bulbashenko.com/app: staging }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: staging-reconciler, namespace: flux-system }
