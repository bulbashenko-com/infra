# One-shot data migration from Coolify (core) into the cluster. Re-run = change nameSuffix in kustomization.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-migrate
  namespace: data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie
          command: ["/bin/sh", "/scripts/pg-migrate.sh"]
          envFrom:
            - secretRef: { name: migrate-source }
          env:
            - { name: DST_PG_USER, valueFrom: { secretKeyRef: { name: pg-superuser, key: username } } }
            - { name: DST_PG_PASSWORD, valueFrom: { secretKeyRef: { name: pg-superuser, key: password } } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: work, mountPath: /work }
      volumes:
        - name: scripts
          configMap: { name: migrate-scripts }
        - name: work
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-sync
  namespace: data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      # Reach the Coolify Garage on core directly (hel1-net), also after the public DNS moves to the tunnel.
      hostAliases:
        - ip: 192.168.100.2
          hostnames: [s3.bulbashenko.com]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: rclone/rclone:1.71.2
          # core's origin cert for s3.bulbashenko.com is only trusted behind Cloudflare; this one-shot copy
          # runs over hel1-net, so TLS verification is skipped here.
          args: ["sync", "old:media", "new:media", "--metadata", "--checksum", "-v", "--config", "/dev/null", "--no-check-certificate"]
          env:
            - { name: RCLONE_CONFIG_OLD_TYPE, value: s3 }
            - { name: RCLONE_CONFIG_OLD_PROVIDER, value: Other }
            - { name: RCLONE_CONFIG_OLD_ENDPOINT, value: "https://s3.bulbashenko.com" }
            - { name: RCLONE_CONFIG_OLD_REGION, value: garage }
            - { name: RCLONE_CONFIG_OLD_FORCE_PATH_STYLE, value: "true" }
            - { name: RCLONE_CONFIG_OLD_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: garage, key: KEY_APP_MEDIA_ID } } }
            - { name: RCLONE_CONFIG_OLD_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: garage, key: KEY_APP_MEDIA_SECRET } } }
            - { name: RCLONE_CONFIG_NEW_TYPE, value: s3 }
            - { name: RCLONE_CONFIG_NEW_PROVIDER, value: Other }
            - { name: RCLONE_CONFIG_NEW_ENDPOINT, value: "http://garage:3900" }
            - { name: RCLONE_CONFIG_NEW_REGION, value: garage }
            - { name: RCLONE_CONFIG_NEW_FORCE_PATH_STYLE, value: "true" }
            - { name: RCLONE_CONFIG_NEW_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: garage, key: KEY_APP_MEDIA_ID } } }
            - { name: RCLONE_CONFIG_NEW_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: garage, key: KEY_APP_MEDIA_SECRET } } }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
