apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
# Restore drill: off-site copy (Storage Box) -> Garage bucket `drill` -> throw-away CNPG cluster pg-drill.
# Removed again once the drill has passed.
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: drill
    includeSelectors: false
    includeTemplates: true
resources:
  - fetch.yaml
configMapGenerator:
  - name: drill-fetch
    files:
      - fetch.sh
      - known_hosts
