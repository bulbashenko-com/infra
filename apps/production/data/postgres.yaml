# Shared Postgres for the site and Ory. Same role names and passwords as on Coolify, so apps only
# change the host to pg-rw.data.svc. Data arrives with the one-shot migration Job at cutover.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  # Primary + one streaming replica on different agent nodes: a node loss means a switchover in seconds,
  # not a restore. Backups (WAL + base, below) still guard against bad writes.
  instances: 2
  # Ownership labels on the instance pods (README: Labels); CNPG patches them onto running pods, no restart.
  inheritedMetadata:
    labels:
      bulbashenko.com/layer: app
      bulbashenko.com/app: data
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    # Keep Postgres off the control plane: only agent nodes.
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.bulbashenko.com/role
                operator: In
                values: [mail, edge]
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie
  enableSuperuserAccess: false
  # Server certificate from the internal CA (postgres-tls.yaml), so clients can use verify-full.
  certificates:
    serverTLSSecret: pg-server-tls
    serverCASecret: pg-server-tls
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "100"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
  bootstrap:
    initdb:
      database: bulbashenko
      owner: bulbashenko
      secret:
        name: pg-role-bulbashenko
  managed:
    roles:
      - name: kratos
        ensure: present
        login: true
        passwordSecret: { name: pg-role-kratos }
      - name: hydra
        ensure: present
        login: true
        passwordSecret: { name: pg-role-hydra }
      - name: keto
        ensure: present
        login: true
        passwordSecret: { name: pg-role-keto }
      - name: stalwart
        ensure: present
        login: true
        passwordSecret: { name: pg-role-stalwart }
      # Staging (apps/staging): own roles and databases in this cluster, nothing shared with production.
      - name: bulbashenko_staging
        ensure: present
        login: true
        passwordSecret: { name: pg-role-bulbashenko-staging }
      - name: kratos_staging
        ensure: present
        login: true
        passwordSecret: { name: pg-role-kratos-staging }
      - name: hydra_staging
        ensure: present
        login: true
        passwordSecret: { name: pg-role-hydra-staging }
      - name: keto_staging
        ensure: present
        login: true
        passwordSecret: { name: pg-role-keto-staging }
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kratos
spec:
  cluster: { name: pg }
  name: kratos
  owner: kratos
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hydra
spec:
  cluster: { name: pg }
  name: hydra
  owner: hydra
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keto
spec:
  cluster: { name: pg }
  name: keto
  owner: keto
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: stalwart
spec:
  cluster: { name: pg }
  name: stalwart
  owner: stalwart
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bulbashenko-staging
spec:
  cluster: { name: pg }
  name: bulbashenko_staging
  owner: bulbashenko_staging
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kratos-staging
spec:
  cluster: { name: pg }
  name: kratos_staging
  owner: kratos_staging
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hydra-staging
spec:
  cluster: { name: pg }
  name: hydra_staging
  owner: hydra_staging
---
apiVersion: postgresql.cnpg.io/v1
