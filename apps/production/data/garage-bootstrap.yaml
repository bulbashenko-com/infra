# Re-run by changing the script (configMap hash changes -> Flux recreates the Job thanks to force).
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bootstrap
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: alpine:3.22
          command: ["/bin/sh", "/scripts/garage-bootstrap.sh"]
          envFrom:
            - secretRef: { name: garage }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
      volumes:
        - name: scripts
          configMap: { name: garage-bootstrap }
