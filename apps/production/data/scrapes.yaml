# Metrics for the monitoring stack (infrastructure/configs/monitoring); vmagent picks up VM*Scrape objects in every namespace.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: pg
spec:
  selector:
    matchLabels: { cnpg.io/cluster: pg, cnpg.io/podRole: instance }
  podMetricsEndpoints:
    - port: metrics
---
# Garage serves /metrics on the admin port and wants the metrics token (metrics_token_file in garage-ha.toml).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: garage
spec:
  selector:
    matchLabels: { app: garage-ha }
  podMetricsEndpoints:
    - port: admin
      path: /metrics
      bearerTokenSecret: { name: garage, key: GARAGE_METRICS_TOKEN }
