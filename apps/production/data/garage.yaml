# The name every client uses (site, CNPG, off-site, volume backups, Traefik routes). Points at the
# replicated garage-ha (garage-ha.yaml).
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  selector: { app: garage-ha }
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
    - { name: web, port: 3902, targetPort: web }
    - { name: admin, port: 3903, targetPort: admin }
