apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
# Ownership labels (see README: Labels). Selectors are left alone.
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: data
    includeSelectors: false
    # No includeTemplates here: it would also label the StatefulSet volumeClaimTemplates, which are
    # immutable. Pod templates in this directory carry the labels explicitly.
resources:
  - namespace.yaml
  - pg-role-bulbashenko.sops.yaml
  - pg-role-kratos.sops.yaml
  - pg-role-hydra.sops.yaml
  - pg-role-keto.sops.yaml
  - pg-role-stalwart.sops.yaml
  - postgres.yaml
  - garage-secret.sops.yaml
  - garage.yaml
  - garage-ha-secret.sops.yaml
  - garage-ha.yaml
  - routes.yaml
  - backup.yaml
  - backup-initial.yaml
configMapGenerator:
  - name: garage-ha-config
    files:
      - garage.toml=garage-ha.toml
  - name: garage-bootstrap
    files:
      - garage-bootstrap.sh
generatorOptions:
  disableNameSuffixHash: false
