apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
# Ownership labels (see README: Labels). Selectors are left alone.
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: data
    includeSelectors: false
    includeTemplates: true
resources:
  - offsite-secret.sops.yaml
  - offsite.yaml
configMapGenerator:
  - name: offsite-backup
    files:
      - offsite.sh
      - known_hosts
