apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: site
# Ownership labels (see README: Labels). Selectors are left alone.
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: site
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - secret.sops.yaml
  - ../../base/site
  - route.yaml
configMapGenerator:
  - name: site-env
    literals:
      # Gallery and files: the Nextcloud Team folder `Site`, read-only as user `site` (password in the Secret), served
      # to visitors by the app at MEDIA_PUBLIC_URL (route.yaml: DNS-only on hel1-edge, outside Cloudflare's proxy).
      - NEXTCLOUD_URL=http://nextcloud.nextcloud.svc.cluster.local:8080
      - NEXTCLOUD_PUBLIC_URL=https://cloud.bulbashenko.com
      - NEXTCLOUD_USER=site
      - NEXTCLOUD_ROOT=Site
      - MEDIA_PUBLIC_URL=https://media.bulbashenko.com
      - NEXT_PUBLIC_SITE_URL=https://bulbashenko.com
      # Read at run time by the sign-in flow (NEXT_PUBLIC_* is fixed at build time).
      - SITE_URL=https://bulbashenko.com
      - OIDC_ISSUER=https://auth.bulbashenko.com
patches:
  # Bump when secret.sops.yaml changes: env from a Secret is read only at pod start.
  - target: { kind: Deployment, name: site }
    patch: |
      - op: add
        path: /spec/template/metadata/annotations
        value: { bulbashenko.com/secret-revision: "4" }
