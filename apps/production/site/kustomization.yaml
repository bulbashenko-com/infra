apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: site
# Ownership labels (see README: Labels). Selectors are left alone.
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: site
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - secret.sops.yaml
  - site.yaml
images:
  # Changed by scripts/promote.sh (on dev, released with the release PR): the image the site CI built.
  - name: ghcr.io/bulbashenko-com/site
    newTag: 5af8c6dfcc169bf19cede421bc57e63272df972b
