apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: site
# Ownership labels (see README: Labels). Selectors are left alone.
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: site
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - secret.sops.yaml
  - ../../base/site
  - route.yaml
configMapGenerator:
  - name: site-env
    literals:
      - S3_BUCKET=media
      - MEDIA_PUBLIC_URL=https://media.bulbashenko.com
      - SKULL_MANIFEST_URL=https://media.bulbashenko.com/skull/current.json
      - NEXT_PUBLIC_SITE_URL=https://bulbashenko.com
      - OIDC_ISSUER=https://auth.bulbashenko.com
patches:
  # Bump when secret.sops.yaml changes: env from a Secret is read only at pod start.
  - target: { kind: Deployment, name: site }
    patch: |
      - op: add
        path: /spec/template/metadata/annotations
        value: { bulbashenko.com/secret-revision: "3" }
