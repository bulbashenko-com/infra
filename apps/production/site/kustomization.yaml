apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: site
# Ownership labels (see README: Labels). Selectors are left alone.
labels:
  - pairs:
      bulbashenko.com/layer: app
      bulbashenko.com/app: site
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - secret.sops.yaml
  - site.yaml
images:
  # Promote = set this to the SHA that passed staging (image built by bulbashenko-com/site CI).
  - name: ghcr.io/bulbashenko-com/site
    newTag: 690408839545c00384c0c7a482b2904fe17a2c5c
