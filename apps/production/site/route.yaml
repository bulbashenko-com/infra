# Public through Cloudflare Tunnel -> Traefik `web`.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site
spec:
  entryPoints: [web]
  routes:
    - match: Host(`bulbashenko.com`)
      services: [{ name: site, port: 3000 }]
    - match: Host(`www.bulbashenko.com`)
      middlewares: [{ name: www-to-apex }]
      services: [{ name: site, port: 3000 }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
spec:
  redirectRegex:
    regex: ^https?://www\.bulbashenko\.com/(.*)
    replacement: https://bulbashenko.com/${1}
    permanent: true
