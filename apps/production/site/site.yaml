# bulbashenko.com (Next.js standalone). Public through Cloudflare Tunnel → Traefik `web`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 1
  selector:
    matchLabels: { app: site }
  template:
    metadata:
      labels: { app: site }
      annotations:
        # Bump when secret.sops.yaml changes: env from a Secret is read only at pod start.
        bulbashenko.com/secret-revision: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        # The image user is `node` (uid 1000); the kubelet needs the numeric id.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: site
          image: ghcr.io/bulbashenko-com/site:latest
          envFrom:
            - secretRef: { name: site }
          env:
            - { name: S3_ENDPOINT, value: "http://garage.data.svc.cluster.local:3900" }
            - { name: S3_BUCKET, value: media }
            - { name: MEDIA_PUBLIC_URL, value: "https://media.bulbashenko.com" }
            - { name: SKULL_MANIFEST_URL, value: "https://media.bulbashenko.com/skull/current.json" }
            - { name: NEXT_PUBLIC_SITE_URL, value: "https://bulbashenko.com" }
            - { name: OIDC_ISSUER, value: "https://auth.bulbashenko.com" }
            - { name: OIDC_CLIENT_ID, value: bulbashenko-site }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            tcpSocket: { port: http }
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: site
spec:
  selector: { app: site }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site
spec:
  entryPoints: [web]
  routes:
    - match: Host(`bulbashenko.com`)
      services: [{ name: site, port: 3000 }]
    - match: Host(`www.bulbashenko.com`)
      middlewares: [{ name: www-to-apex }]
      services: [{ name: site, port: 3000 }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
spec:
  redirectRegex:
    regex: ^https?://www\.bulbashenko\.com/(.*)
    replacement: https://bulbashenko.com/${1}
    permanent: true
