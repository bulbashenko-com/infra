# Nextcloud from the official chart. Major versions must be upgraded one at a time, and each chart major follows one.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nextcloud
spec:
  interval: 12h
  url: https://nextcloud.github.io/helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  interval: 1h
  # The first start installs Nextcloud onto SMB, which is slow.
  timeout: 20m
  chart:
    spec:
      chart: nextcloud
      version: 9.4.1
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  commonMetadata:
    labels:
      bulbashenko.com/layer: app
      bulbashenko.com/app: nextcloud
  values:
    # Bump when secret.sops.yaml changes: env from a Secret is read only at pod start.
    podAnnotations:
      bulbashenko.com/secret-revision: "4"
    podLabels: &labels
      bulbashenko.com/layer: app
      bulbashenko.com/app: nextcloud
    nextcloud:
      host: cloud.bulbashenko.com
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
        tokenKey: nextcloud-token
        smtpUsernameKey: smtp-username
        smtpPasswordKey: smtp-password
        smtpHostKey: smtp-host
      mail:
        enabled: true
        fromAddress: noreply
        domain: bulbashenko.com
        smtp:
          secure: ssl
          port: 465
          authtype: LOGIN
      configs:
        cluster.config.php: |-
          <?php
          $CONFIG = array (
            'overwritehost' => 'cloud.bulbashenko.com',
            'overwriteprotocol' => 'https',
            'overwrite.cli.url' => 'https://cloud.bulbashenko.com',
            // The site reads its Team folder through the Service (apps/production/site).
            'trusted_domains' => array ('cloud.bulbashenko.com', 'nextcloud.nextcloud.svc.cluster.local'),
            // cloudflared and Traefik run in the pod network.
            'trusted_proxies' => array ('10.42.0.0/16'),
            // SMB reports the mode from the mount options, not from chmod.
            'check_data_directory_permissions' => false,
            // Under Cloudflare's 100 MB request limit (the default here is 100 MiB). The iOS app ignores this value.
            'files.chunked_upload.max_size' => 50000000,
            'default_phone_region' => 'SK',
            'maintenance_window_start' => 1,
            // Container log instead of a file on the SMB share.
            'log_type' => 'errorlog',
            // Previews for pictures of any size (the default skips files over 50 MB); memory per picture in MiB.
            'preview_max_filesize_image' => -1,
            'preview_max_memory' => 512,
          );
      hooks:
        # Runs on every start, so all of it is idempotent.
        before-starting: |-
          #!/bin/sh
          set -eu
          for app in calendar contacts user_oidc groupfolders files_external; do
            php occ app:getpath "$app" >/dev/null 2>&1 || php occ app:install --keep-disabled "$app"
            php occ app:enable "$app"
          done
          php occ config:app:set files default_quota --value="500 GB"
          php occ config:app:set serverinfo token --value="$NC_METRICS_TOKEN"
          # Straight to Ory; the local nc-admin stays reachable at /login?direct=1.
          php occ config:app:set --type=string --value=0 user_oidc allow_multiple_user_backends
          php occ user_oidc:provider ory \
            --clientid=nextcloud \
            --clientsecret-env=OIDC_CLIENT_SECRET \
            --discoveryuri=https://auth.bulbashenko.com/.well-known/openid-configuration \
            --scope='openid email profile groups' \
            --send-id-token-hint=1 \
            --unique-uid=0 \
            --mapping-uid=preferred_username \
            --mapping-email=email \
            --mapping-display-name=name \
            --mapping-groups=groups \
            --group-provisioning=1 \
            --group-whitelist-regex='/^cloud-users$/'
          # The owner's Ory login. Exists after the first sign-in; takes effect on the next start.
          if php occ user:info admin >/dev/null 2>&1; then php occ group:adduser admin admin; fi

          # The site's media (bulbashenko-com/site docs/deployment.md): Team folder `Site`, the admin group writes,
          # the local user `site` (the app) only reads. Gallery/ and Files/ inside are made by media-import.yaml.
          php occ group:add site-reader >/dev/null 2>&1 || true
          if php occ user:info site >/dev/null 2>&1; then
            OC_PASS="$SITE_PASSWORD" php occ user:resetpassword --password-from-env site >/dev/null
          else
            OC_PASS="$SITE_PASSWORD" php occ user:add --password-from-env --display-name bulbashenko.com site
          fi
          php occ group:adduser site-reader site
          folder=$(php occ groupfolders:list --output=json | php -r '
            foreach (json_decode(stream_get_contents(STDIN), true) as $f) if ($f["mountPoint"] === "Site") echo $f["id"];')
          [ -n "$folder" ] || folder=$(php occ groupfolders:create Site)
          php occ groupfolders:group "$folder" admin read write share delete >/dev/null
          php occ groupfolders:group "$folder" site-reader read >/dev/null

          # Backups in Garage, read-only for the admin group (Garage key nextcloud-browse can only read).
          mounts=$(php occ files_external:list --output=json)
          for m in postgres:cnpg-backups volumes:restore; do
            point="/Backups/${m%%:*}"; bucket="${m#*:}"
            id=$(printf %s "$mounts" | php -r '
              foreach (json_decode(stream_get_contents(STDIN), true) as $x) if ($x["mount_point"] === $argv[1]) echo $x["mount_id"];' "$point")
            [ -n "$id" ] || id=$(php occ files_external:create "$point" amazons3 amazons3::accesskey \
              -c bucket="$bucket" -c hostname=garage.data.svc.cluster.local -c port=3900 -c region=garage \
              -c use_ssl=false -c use_path_style=true --applicable-group=admin --output=json)
            php occ files_external:config "$id" key "$GARAGE_BROWSE_ID"
            php occ files_external:config "$id" secret "$GARAGE_BROWSE_SECRET"
            php occ files_external:option "$id" readonly true
            php occ files_external:option "$id" previews false
            php occ files_external:option "$id" enable_sharing false
          done
      extraEnv:
        - name: OIDC_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: nextcloud, key: oidc-client-secret } }
        - name: NC_METRICS_TOKEN
          valueFrom: { secretKeyRef: { name: nextcloud, key: nextcloud-token } }
        - name: SITE_PASSWORD
          valueFrom: { secretKeyRef: { name: nextcloud, key: site-password } }
        - name: GARAGE_BROWSE_ID
          valueFrom: { secretKeyRef: { name: nextcloud, key: garage-browse-id } }
        - name: GARAGE_BROWSE_SECRET
          valueFrom: { secretKeyRef: { name: nextcloud, key: garage-browse-secret } }
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: pg-rw.data.svc.cluster.local:5432
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: db-username
        passwordKey: db-password
    externalRedis:
      enabled: true
      host: valkey
      port: "6379"
      existingSecret:
        enabled: true
        secretName: nextcloud
        passwordKey: redis-password
    persistence:
      enabled: true
      existingClaim: nextcloud-html
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data
    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        podLabels: *labels
        securityContext:
          runAsUser: 33
          runAsGroup: 33
          runAsNonRoot: true
        resources:
          requests: { cpu: 20m, memory: 128Mi }
          limits: { memory: 768Mi }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1536Mi }
    startupProbe:
      enabled: true
      failureThreshold: 90
    metrics:
      enabled: true
      podLabels: *labels
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { memory: 64Mi }
