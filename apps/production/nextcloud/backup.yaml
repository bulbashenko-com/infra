# Nightly copy of config.php to Garage restore/nextcloud-config.tar.gz (03:30 UTC); the 04:00 off-site job carries it to
# the Storage Box. Files are not copied (owner's decision), the database is in the CNPG backups.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: volume-backup
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: alpine:3.22
              command: ["/bin/sh", "/scripts/volume-backup.sh"]
              env:
                - { name: ARCHIVE, value: nextcloud-config.tar.gz }
                - { name: RUN_AS, value: "33:33" }
                - name: RESTORE_S3_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: nextcloud, key: RESTORE_S3_ACCESS_KEY_ID } }
                - name: RESTORE_S3_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: nextcloud, key: RESTORE_S3_SECRET_ACCESS_KEY } }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 256Mi }
              securityContext:
                # Root only to install tools; the data is read as the app user via su-exec.
                runAsUser: 0
                allowPrivilegeEscalation: false
              volumeMounts:
                - { name: html, mountPath: /data, subPath: config, readOnly: true }
                - { name: scripts, mountPath: /scripts }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: html
              persistentVolumeClaim: { claimName: nextcloud-html }
            - name: scripts
              configMap: { name: volume-backup }
            - { name: tmp, emptyDir: {} }
