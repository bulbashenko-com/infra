# Values of every SOPS Secret in the CI cluster (scripts/ci-secrets.py, .github/workflows/cluster-e2e.yml). The age key
# never reaches CI; instead each Secret gets fresh values here. `{{name}}` is a random value made once per run and
# reused everywhere the same name appears, so linked values match (a role's password and the DSN that uses it, an
# OIDC client's secret in Hydra and in its app, a Garage key and its users). Formats: `{{name}}` 32 hex characters,
# `{{name:gk}}` a Garage key id, `{{name:hex64}}` 64 hex characters, `{{name:rsa}}` an RSA private key (PEM).
#
# ci-secrets.py fails when this file and the *.sops.yaml files disagree on a Secret or its keys: a new secret or key
# in production must be added here.
secrets:
  # --- data
  data/pg-role-bulbashenko: { username: bulbashenko, password: "{{pg_bulbashenko}}" }
  data/pg-role-kratos: { username: kratos, password: "{{pg_kratos}}" }
  data/pg-role-hydra: { username: hydra, password: "{{pg_hydra}}" }
  data/pg-role-keto: { username: keto, password: "{{pg_keto}}" }
  data/pg-role-stalwart: { username: stalwart, password: "{{pg_stalwart}}" }
  data/pg-role-nextcloud: { username: nextcloud, password: "{{pg_nextcloud}}" }
  data/pg-role-bulbashenko-staging: { username: bulbashenko_staging, password: "{{pg_bulbashenko_staging}}" }
  data/pg-role-kratos-staging: { username: kratos_staging, password: "{{pg_kratos_staging}}" }
  data/pg-role-hydra-staging: { username: hydra_staging, password: "{{pg_hydra_staging}}" }
  data/pg-role-keto-staging: { username: keto_staging, password: "{{pg_keto_staging}}" }
  data/garage-ha:
    GARAGE_RPC_SECRET: "{{garage_rpc:hex64}}"
  data/garage:
    GARAGE_RPC_SECRET: "{{garage_rpc:hex64}}"
    GARAGE_ADMIN_TOKEN: "{{garage_admin}}"
    GARAGE_METRICS_TOKEN: "{{garage_metrics}}"
    S3_REGION: garage
    KEY_APP_MEDIA_ID: "{{key_app_media:gk}}"
    KEY_APP_MEDIA_SECRET: "{{key_app_media_secret:hex64}}"
    KEY_APP_MEDIA_STAGING_ID: "{{key_app_media_staging:gk}}"
    KEY_APP_MEDIA_STAGING_SECRET: "{{key_app_media_staging_secret:hex64}}"
    KEY_STAGING_EXPORT_ID: "{{key_staging_export:gk}}"
    KEY_STAGING_EXPORT_SECRET: "{{key_staging_export_secret:hex64}}"
    KEY_STAGING_RESTORE_ID: "{{key_staging_restore:gk}}"
    KEY_STAGING_RESTORE_SECRET: "{{key_staging_restore_secret:hex64}}"
    KEY_CI_SKULL_ID: "{{key_ci_skull:gk}}"
    KEY_CI_SKULL_SECRET: "{{key_ci_skull_secret:hex64}}"
    KEY_CNPG_ID: "{{key_cnpg:gk}}"
    KEY_CNPG_SECRET: "{{key_cnpg_secret:hex64}}"
    KEY_OFFSITE_ID: "{{key_offsite:gk}}"
    KEY_OFFSITE_SECRET: "{{key_offsite_secret:hex64}}"
    KEY_RESTORE_ID: "{{key_restore:gk}}"
    KEY_RESTORE_SECRET: "{{key_restore_secret:hex64}}"
    KEY_NEXTCLOUD_BROWSE_ID: "{{key_nextcloud_browse:gk}}"
    KEY_NEXTCLOUD_BROWSE_SECRET: "{{key_nextcloud_browse_secret:hex64}}"
  data/offsite-backup:
    BOX_USER: ci
    BOX_PASSWORD: "{{box_password}}"
    CRYPT_PASSWORD: "{{crypt_password}}"
    CRYPT_SALT: "{{crypt_salt}}"

  # --- auth (Ory). Kratos' cipher secret must be exactly 32 characters, which `{{name}}` is.
  auth/auth:
    KRATOS_DSN: "postgres://kratos:{{pg_kratos}}@pg-rw.data.svc.cluster.local:5432/kratos?sslmode=require"
    HYDRA_DSN: "postgres://hydra:{{pg_hydra}}@pg-rw.data.svc.cluster.local:5432/hydra?sslmode=require"
    KETO_DSN: "postgres://keto:{{pg_keto}}@pg-rw.data.svc.cluster.local:5432/keto?sslmode=require"
    KRATOS_SECRETS_COOKIE: "{{kratos_cookie}}"
    KRATOS_SECRETS_DEFAULT: "{{kratos_default}}"
    KRATOS_SECRETS_CIPHER: "{{kratos_cipher}}"
    KRATOS_SECRETS_PAGINATION: "{{kratos_pagination}}"
    HYDRA_SECRETS_SYSTEM: "{{hydra_system}}"
    HYDRA_SECRETS_COOKIE: "{{hydra_cookie}}"
    HYDRA_SECRETS_PAGINATION: "{{hydra_pagination}}"
    # Kratos' mail goes to mailpit (auth repo, deploy/ci): nothing leaves the cluster.
    SMTP_CONNECTION_URI: "smtp://mailpit.auth.svc.cluster.local:1025/?disable_starttls=true"
    SMTP_SENDER: noreply@bulbashenko.com
    OIDC_SITE_CLIENT_SECRET: "{{oidc_site}}"
    OIDC_HEADSCALE_CLIENT_SECRET: "{{oidc_headscale}}"
    OIDC_FLUXWEB_CLIENT_SECRET: "{{oidc_fluxweb}}"
    OIDC_GRAFANA_CLIENT_SECRET: "{{oidc_grafana}}"
    OIDC_NEXTCLOUD_CLIENT_SECRET: "{{oidc_nextcloud}}"

  # --- site
  site/site:
    DATABASE_URL: "postgres://bulbashenko:{{pg_bulbashenko}}@pg-rw.data.svc.cluster.local:5432/bulbashenko?sslmode=verify-full&sslrootcert=/etc/internal-ca/ca.crt"
    JWT_SECRET: "{{site_jwt:hex64}}"
    OIDC_CLIENT_SECRET: "{{oidc_site}}"
    NEXTCLOUD_PASSWORD: "{{nextcloud_site}}"

  # --- nextcloud
  nextcloud/nextcloud:
    nextcloud-username: admin
    nextcloud-password: "{{nextcloud_admin}}"
    nextcloud-token: "{{nextcloud_metrics}}"
    db-username: nextcloud
    db-password: "{{pg_nextcloud}}"
    redis-password: "{{valkey}}"
    smtp-host: mailpit.auth.svc.cluster.local
    smtp-username: ci
    smtp-password: "{{smtp_nextcloud}}"
    oidc-client-secret: "{{oidc_nextcloud}}"
    RESTORE_S3_ACCESS_KEY_ID: "{{key_restore:gk}}"
    RESTORE_S3_SECRET_ACCESS_KEY: "{{key_restore_secret:hex64}}"
    site-password: "{{nextcloud_site}}"
    garage-browse-id: "{{key_nextcloud_browse:gk}}"
    garage-browse-secret: "{{key_nextcloud_browse_secret:hex64}}"
  nextcloud/nextcloud-smb: { username: ci, password: "{{smb}}" }

  # --- mail
  mail/stalwart:
    STALWART_DB_PASSWORD: "{{pg_stalwart}}"
    CF_DNS_API_TOKEN: ci-not-a-token
    RESTORE_S3_ACCESS_KEY_ID: "{{key_restore:gk}}"
    RESTORE_S3_SECRET_ACCESS_KEY: "{{key_restore_secret:hex64}}"
    STALWART_METRICS_USERNAME: metrics
    STALWART_METRICS_PASSWORD: "{{stalwart_metrics}}"

  # --- edge
  headscale/headscale:
    HEADSCALE_OIDC_CLIENT_SECRET: "{{oidc_headscale}}"
    RESTORE_S3_ACCESS_KEY_ID: "{{key_restore:gk}}"
    RESTORE_S3_SECRET_ACCESS_KEY: "{{key_restore_secret:hex64}}"

  # --- platform. Nothing here reaches the outside: cert-manager uses the internal CA, cloudflared and Flux Operator
  # (flux-web) do not run, Alertmanager's Telegram receiver has nowhere to send.
  cert-manager/cloudflare-api-token: { api-token: ci-not-a-token }
  cloudflared/tunnel-token: { token: ci-not-a-token }
  flux-system/flux-web-config: { config.yaml: "{}" }
  monitoring/grafana:
    admin-user: admin
    admin-password: "{{grafana_admin}}"
    oidc-client-secret: "{{oidc_grafana}}"
    github-app-id: "1"
    github-app-installation-id: "1"
    github-app-private-key: "{{grafana_github_app:rsa}}"
  monitoring/telegram: { token: "123456789:ci-not-a-token" }
