# Watches the open release PR dev -> main and acts once it can be merged:
#   - Flux posted the staging verdicts (staging/auth-e2e, staging/site-e2e) on its head and every check is green;
#   - a release of security updates only (label security-only, set by scripts/release-pr.sh) is merged right away by
#     the deploy App: decided by the owner, so fixes for known vulnerabilities do not wait (docs/workflow.md);
#   - any other release: one Telegram message "ready to merge", once per head commit.
# Runs when a commit status arrives (Flux, CI), when the PR is labelled, and every 30 minutes as a backstop.
name: release-gate

on:
  status:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: release-gate
  cancel-in-progress: false

jobs:
  gate:
    # Status events from other branches (feature PRs, main) are not about the release PR.
    if: github.event_name != 'status' || contains(github.event.branches.*.name, 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Merge a security release, or say the release is ready
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STATUS_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --base main --head dev --state open --json number,title,headRefOid,labels,mergeStateStatus,url -q '.[0] // empty')
          [ -n "$pr" ] || { echo "no open release PR"; exit 0; }
          number=$(jq -r .number <<<"$pr") head=$(jq -r .headRefOid <<<"$pr") url=$(jq -r .url <<<"$pr")
          title=$(jq -r .title <<<"$pr") merge=$(jq -r .mergeStateStatus <<<"$pr")
          security=$(jq -r '[.labels[].name] | index("security-only") != null' <<<"$pr")
          statuses=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" -q '.statuses')
          verdict() { jq -r --arg c "$1" '[.[] | select(.context == $c)][0].state // "missing"' <<<"$statuses"; }
          auth=$(verdict staging/auth-e2e) site=$(verdict staging/site-e2e)
          echo "#$number ${head:0:7}: merge state $merge, staging auth $auth, site $site, security-only $security"
          # Both staging verdicts must be green whatever the ruleset says; CLEAN = every required check passed.
          if [ "$auth" != success ] || [ "$site" != success ] || [ "$merge" != CLEAN ]; then exit 0; fi

          if [ "$security" = true ]; then
            gh pr merge "$number" --merge --subject "$title (#$number)"
            scripts/telegram.sh "🛡 <b>Security-релиз смержен автоматически</b>
          $(sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' <<<"$title")
          Staging и e2e зелёные. Дальше — сообщение о выкатке. <a href=\"$url\">PR #$number</a>"
            exit 0
          fi

          # One message per head commit: remembered as a commit status (GITHUB_TOKEN statuses trigger no workflows).
          seen=$(jq -r '[.[] | select(.context == "release/notified")][0].state // ""' <<<"$statuses")
          [ -z "$seen" ] || { echo "already announced"; exit 0; }
          scripts/telegram.sh "📦 <b>Релиз готов к merge</b>
          $(sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' <<<"$title")
          Staging проверен, все проверки зелёные. <a href=\"$url\">Открыть PR #$number</a>"
          GH_TOKEN=$STATUS_TOKEN gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state=success \
            -f context=release/notified -f description="Telegram: ready to merge" >/dev/null
