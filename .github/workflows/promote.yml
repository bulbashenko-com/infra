# Pins an app's new commit on dev (scripts/promote.sh): a direct commit by the deploy GitHub App, which may
# push to dev. dev is staging; production (main) gets the pin with the next release PR (release.yml).
# Triggered by the app repos after a push to main (request-promote.yml), or by hand: `just promote <app> [sha]`,
# which may also roll back (FORCE=1).
name: promote

on:
  repository_dispatch:
    types: [promote]
  workflow_dispatch:
    inputs:
      app:
        type: choice
        options: [site, auth, mail, teamspeak]
      sha:
        description: Full commit SHA on the app's main (empty = latest main)
        required: false

permissions:
  contents: read

concurrency:
  # One run per app at a time; a newer pending request replaces an older pending one.
  group: promote-${{ github.event.client_payload.app || inputs.app }}
  cancel-in-progress: false

jobs:
  pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Pin the commit on dev
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP: ${{ github.event.client_payload.app || inputs.app }}
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
          # A manual run is deliberate: it may pin an older commit (rollback).
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: scripts/promote.sh "$APP" "$SHA"
