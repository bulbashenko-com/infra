# OpenTofu (terraform/) without anyone running it by hand:
# - pull request touching terraform/: plan with read-only credentials, posted as a comment (the release PR dev -> main
#   included, so the owner sees what the release will change);
# - push to main touching terraform/ (= a release): apply, in environment `production` (main only), with the
#   read-write credentials.
# Credentials are SOPS files decrypted with an age key per job (scripts/tofu-ci-bootstrap.sh); state is in R2.
name: tofu

on:
  pull_request:
    paths: [terraform/**, .github/workflows/tofu.yml]
  push:
    branches: [main]
    paths: [terraform/**]
  workflow_dispatch:

permissions:
  contents: read

# One OpenTofu run at a time (the R2 lock file guards apply too).
concurrency:
  group: tofu-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOPS_VERSION: v3.13.3
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b

jobs:
  plan:
    # Forks get no secrets; only branches of this repo are planned.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Install sops
        run: |
          curl -fsSLo /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.linux.amd64"
          echo "$SOPS_SHA256  /usr/local/bin/sops" | sha256sum -c -
          chmod +x /usr/local/bin/sops
      - name: Plan
        id: plan
        working-directory: terraform
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PLAN }}
        run: |
          set +e
          sops exec-env creds-plan.sops.env 'sops exec-env secrets.sops.env "tofu init -input=false -no-color >/dev/null && tofu plan -input=false -lock=false -no-color -compact-warnings -detailed-exitcode"' > plan.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -40 plan.txt
          # 0 = no changes, 2 = changes; anything else failed.
          [ $code -eq 0 ] || [ $code -eq 2 ]
      - name: Comment
        if: always() && steps.plan.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.plan.outputs.code }}
        run: |
          marker='<!-- tofu-plan -->'
          case $CODE in
            0) head='OpenTofu: **no changes**' ;;
            2) head="OpenTofu: $(grep -E '^Plan:' terraform/plan.txt | tail -1 || echo 'changes')" ;;
            *) head='OpenTofu: **plan failed**' ;;
          esac
          {
            echo "$marker"
            echo "$head (applied by CI when this reaches \`main\`)"
            echo
            echo '<details><summary>plan</summary>'
            echo
            echo '```'
            grep -vE '^(Acquiring|Releasing|Refreshing state|.*: Refreshing state|.*: Reading|.*: Read complete)' terraform/plan.txt | tail -c 60000
            echo '```'
            echo '</details>'
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" -F comment.md >/dev/null
          fi

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Install sops
        run: |
          curl -fsSLo /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.linux.amd64"
          echo "$SOPS_SHA256  /usr/local/bin/sops" | sha256sum -c -
          chmod +x /usr/local/bin/sops
      - name: Apply
        working-directory: terraform
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_APPLY }}
        run: |
          sops exec-env creds-apply.sops.env 'sops exec-env secrets.sops.env "tofu init -input=false -no-color >/dev/null && tofu apply -input=false -auto-approve -no-color -compact-warnings"' 2>&1 |
            grep -vE '(: Refreshing state|: Reading|: Read complete)'
