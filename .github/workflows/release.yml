# Keeps the release PR dev -> main current (scripts/release-pr.sh). Merging that PR is the release.
# The App token (not GITHUB_TOKEN) is needed so the PR runs the required checks.
name: release

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or refresh the release PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/release-pr.sh
