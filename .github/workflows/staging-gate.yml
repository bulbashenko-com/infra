# The release gate is posted by Flux itself: staging/auth-e2e and staging/site-e2e on the dev commit that was tested
# (apps/staging-platform/notify.yaml), required to merge into main. A pull request into main from anything but dev is
# a hotfix, not a release of staging: this workflow marks both contexts as not applicable so the PR can merge.
name: staging-gate

on:
  pull_request:
    branches: [main]

permissions:
  statuses: write

jobs:
  hotfix:
    if: github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Mark staging checks as not applicable
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for ctx in staging/auth-e2e staging/site-e2e; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context="$ctx" \
              -f description="hotfix, not a staging release" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
            echo "$ctx on ${SHA:0:7}: success (hotfix)"
          done
