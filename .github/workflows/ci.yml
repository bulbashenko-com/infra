name: CI

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
      - name: SOPS encryption check
        run: scripts/check-sops.sh

  tofu-fmt:
    name: tofu-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
      - run: tofu fmt -check -recursive -diff terraform

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: kustomize build every overlay Flux reconciles
        run: |
          set -euo pipefail
          for d in infrastructure/controllers infrastructure/configs apps/production apps/production/site apps/staging apps/edge apps/mail; do
            echo "== $d"; kubectl kustomize "$d" > /dev/null
          done

  yaml:
    name: yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: yamllint (syntax + duplicate keys)
        # yq and kustomize silently accept duplicate keys; files outside kustomize builds
        # (clusters/hel1) are otherwise never checked before Flux applies them.
        run: |
          pipx run yamllint==1.37.1 -d '{rules: {key-duplicates: enable}}' .
