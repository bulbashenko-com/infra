name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
      - name: SOPS encryption check
        run: scripts/check-sops.sh

  tofu-fmt:
    name: tofu-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
      - run: tofu fmt -check -recursive -diff terraform

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: kustomize build every overlay Flux reconciles
        run: |
          set -euo pipefail
          for d in infrastructure/controllers infrastructure/configs apps/production apps/production/site apps/production/nextcloud apps/staging apps/staging/auth/e2e apps/staging/site-e2e/job apps/staging-platform apps/edge apps/mail; do
            echo "== $d"; kubectl kustomize "$d" > /dev/null
          done

  dashboards:
    name: dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the Grafana JSON matches its generator (scripts/dashboards)
        run: |
          python3 -m scripts.dashboards infrastructure/configs/monitoring/dashboards
          git diff --exit-code -- infrastructure/configs/monitoring/dashboards || {
            echo "::error::regenerate: python3 -m scripts.dashboards infrastructure/configs/monitoring/dashboards"; exit 1; }
  # Every manifest against its schema (Kubernetes and the CRDs we use), so a wrong field fails here, not in Flux.
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
      - name: Validate every overlay Flux reconciles
        run: |
          set -euo pipefail
          # SOPS-encrypted Secrets carry a `sops` block Kubernetes never sees (Flux decrypts first): skipped.
          for d in $(git ls-files '*kustomization.yaml' | xargs -n1 dirname | sort -u); do
            grep -q '^kind: Component' "$d/kustomization.yaml" && continue
            echo "== $d"
            kubectl kustomize "$d" | ./kubeconform -strict -summary -skip Secret -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  # Renders the whole cluster as Flux would (Kustomizations, HelmReleases with their charts, other repos' sources)
  # without a cluster. `flate test` fails on anything that would not render; on pull requests the difference
  # against the base branch is posted as the comment «Что изменится в кластере». flate is flux-local's successor.
  render:
    name: render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: home-operations/flate/action@v0.6.5
        with:
          base: ${{ github.base_ref || github.ref_name }}
      - name: Render
        run: flate test
      - name: Diff for the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          diff=$(flate diff --base "origin/$BASE" -o github 2>diff.err); rc=$?
          {
            echo "<!-- flate-diff -->"
            echo "### Что изменится в кластере (\`$BASE\` → этот PR)"
            echo
            if [ -n "$diff" ]; then
              echo "$diff" | head -c 60000
            else
              echo "Ничего: отрисованные манифесты не меняются."
            fi
            if [ "$rc" -ne 0 ]; then echo; echo "> [!WARNING]"; echo "> flate не смог отрисовать часть объектов, подробности в логе job \`render\`."; fi
          } > comment.md
          cat diff.err >&2
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- flate-diff -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else gh pr comment "$PR" --body-file comment.md >/dev/null; fi
          exit $rc

  yaml:
    name: yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: yamllint (syntax + duplicate keys)
        # yq and kustomize silently accept duplicate keys; files outside kustomize builds
        # (clusters/hel1) are otherwise never checked before Flux applies them.
        run: |
          pipx run yamllint==1.37.1 -d '{rules: {key-duplicates: enable}}' .
